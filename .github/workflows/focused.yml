name: Focused verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [local-install, control-contract]
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE: ${{ runner.temp }}/focused-evidence
      CHECK: ${{ matrix.check }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Initialize evidence
        run: mkdir -p "$EVIDENCE"

      - name: Check out reviewed revision
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record verification inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          {
            printf 'check=%s\nevent=%s\nevent_sha=%s\nevent_ref=%s\n' \
              "$CHECK" "$EVENT_NAME" "$EVENT_SHA" "$EVENT_REF"
            printf 'pr_head_sha=%s\nworkflow_ref=%s\nworkflow_sha=%s\n' \
              "$PR_HEAD_SHA" "$WORKFLOW_REF" "$WORKFLOW_SHA"
            printf 'run_id=%s\nrun_attempt=%s\nchecked_revision=' "$RUN_ID" "$RUN_ATTEMPT"
            git rev-parse HEAD
            printf 'runner_image=%s\nrunner_image_version=%s\n' \
              "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            printf '\nInput SHA-256 checksums:\n'
            sha256sum Cargo.lock Cargo.toml package-lock.json package.json \
              rust-toolchain.toml Makefile upstream/sources.toml \
              .github/workflows/focused.yml
          } > "$EVIDENCE/inputs.txt"
          cp Cargo.lock package-lock.json rust-toolchain.toml "$EVIDENCE/"

      - name: Set up Node
        if: matrix.check == 'local-install'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install repository Rust toolchain
        if: matrix.check == 'control-contract'
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          # rustup reads the checked-out rust-toolchain.toml, including components.
          timeout --kill-after=30s 5m rustup show active-toolchain 2>&1 \
            | tail -c 1048576 | tee "$EVIDENCE/rust-toolchain-setup.log"

      - name: Run focused check
        id: check
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          case "$CHECK" in
            local-install)
              command=(make test-local-install)
              {
                node --version
                npm --version
                make --version
              } > "$EVIDENCE/toolchain.txt"
              ;;
            control-contract)
              command=(cargo test -p quickshare-contract-tests --test suite --locked control_contract::)
              {
                rustup show active-toolchain
                rustc --version --verbose
                cargo --version --verbose
              } > "$EVIDENCE/toolchain.txt"
              ;;
            *) exit 2 ;;
          esac
          printf '%q ' "${command[@]}" > "$EVIDENCE/command.txt"
          printf '\n' >> "$EVIDENCE/command.txt"
          # Drain all output but retain only its final MiB. pipefail preserves failure.
          if timeout --kill-after=30s 10m "${command[@]}" 2>&1 \
            | tail -c 1048576 | tee "$EVIDENCE/check.log"; then
            status=0
          else
            status=$?
          fi
          printf 'exit_status=%s\n' "$status" > "$EVIDENCE/result.txt"
          exit "$status"

      - name: Record final step outcomes
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          printf 'checkout=%s\ncheck=%s\njob_status=%s\n' \
            "$CHECKOUT_OUTCOME" "$CHECK_OUTCOME" "$JOB_STATUS" \
            > "$EVIDENCE/outcomes.txt"

      - name: Retain focused evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: focused-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 14
          if-no-files-found: error
